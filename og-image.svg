<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Horacio Come Open Graph Image</title>
  <desc id="desc">A black terminal-style preview image for Horacio Come, Android Engineer.</desc>
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#grain)" opacity="0.18"/>
  <rect x="54" y="58" width="1092" height="514" rx="22" fill="#040404" stroke="#1B1B1B" stroke-width="2"/>
  <rect x="78" y="82" width="1044" height="48" rx="14" fill="#0A0A0A" stroke="#181818"/>
  <circle cx="108" cy="106" r="7" fill="#FF6B6B"/>
  <circle cx="132" cy="106" r="7" fill="#F0B429"/>
  <circle cx="156" cy="106" r="7" fill="#22C55E"/>
  <text x="190" y="113" fill="#8A8A8A" font-family="Menlo, Consolas, monospace" font-size="18">~/horacio/portfolio</text>
  <text x="1020" y="113" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="18">stable build</text>

  <text x="96" y="186" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="24">$ whoami</text>
  <text x="96" y="246" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="22" letter-spacing="3">ANDROID ENGINEER</text>
  <text x="96" y="322" fill="#F2F2F2" font-family="Menlo, Consolas, monospace" font-size="64">Horácio Comé</text>

  <text x="96" y="390" fill="#DDDDDD" font-family="Menlo, Consolas, monospace" font-size="25">Kotlin Android engineer building reliable product systems</text>
  <text x="96" y="426" fill="#DDDDDD" font-family="Menlo, Consolas, monospace" font-size="25">with growing backend ownership across fintech, retail,</text>
  <text x="96" y="462" fill="#DDDDDD" font-family="Menlo, Consolas, monospace" font-size="25">and scheduling workflows.</text>

  <rect x="742" y="182" width="326" height="208" rx="16" fill="#080808" stroke="#181818"/>
  <text x="768" y="218" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="20">$ cat profile.json</text>
  <text x="768" y="266" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="18">experience</text>
  <text x="920" y="266" fill="#F0F0F0" font-family="Menlo, Consolas, monospace" font-size="18">7+ years</text>
  <text x="768" y="300" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="18">primary</text>
  <text x="920" y="300" fill="#F0F0F0" font-family="Menlo, Consolas, monospace" font-size="18">Kotlin / Android</text>
  <text x="768" y="334" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="18">backend</text>
  <text x="920" y="334" fill="#F0F0F0" font-family="Menlo, Consolas, monospace" font-size="18">Ktor / PostgreSQL</text>
  <text x="768" y="368" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="18">status</text>
  <text x="920" y="368" fill="#FFFFFF" font-family="Menlo, Consolas, monospace" font-size="18">open to product work</text>

  <rect x="742" y="416" width="326" height="114" rx="16" fill="#080808" stroke="#181818"/>
  <text x="768" y="452" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="20">$ current-mode</text>
  <text x="768" y="496" fill="#DDDDDD" font-family="Menlo, Consolas, monospace" font-size="18">android / kotlin / backend / ownership</text>

  <rect x="72" y="538" width="1056" height="18" rx="9" fill="#0A0A0A" stroke="#16311D"/>
  <text x="94" y="551" fill="#7EE787" font-family="Menlo, Consolas, monospace" font-size="15">horacio@portfolio</text>
  <text x="252" y="551" fill="#8A8A8A" font-family="Menlo, Consolas, monospace" font-size="15">:</text>
  <text x="268" y="551" fill="#F0F0F0" font-family="Menlo, Consolas, monospace" font-size="15">~/workspace</text>
  <text x="394" y="551" fill="#8A8A8A" font-family="Menlo, Consolas, monospace" font-size="15">$ open collaboration --focus android backend reliability</text>
  <rect x="1010" y="543" width="8" height="10" fill="#7EE787"/>

  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4V4H0V0Z" fill="black"/>
      <path d="M0 1H4" stroke="white" stroke-opacity="0.08"/>
    </pattern>
